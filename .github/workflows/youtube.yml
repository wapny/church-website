  # Обновляет data/broadcast.json: текущий LIVE-эфир или последняя воскресная трансляция.
  # Ключ YouTube Data API хранится в GitHub Secret YOUTUBE_API_KEY.
  # Подробности — YOUTUBE-SETUP.md.
  name: YouTube broadcast

  on:
    schedule:
      # Расписание GitHub задаётся в UTC (0 = воскресенье, 6 = суббота).
      # Воскресенье по Риге 00:00–24:00:
      #   зимой (UTC+2) = суббота 22:00 – воскресенье 22:00 UTC,
      #   летом (UTC+3) = суббота 21:00 – воскресенье 21:00 UTC.
      # Каждые 5 минут: суббота 21:00–23:55 UTC и воскресенье 00:00–21:55 UTC
      # (покрывает воскресенье по Риге и зимой, и летом).
      - cron: '*/5 21-23 * * 6'
      - cron: '*/5 0-21 * * 0'
      # Всё остальное время — каждые 30 минут, без пересечения с 5-минутными запусками:
      - cron: '7,37 * * * 1-5'
      - cron: '7,37 0-20 * * 6'
      - cron: '7,37 22-23 * * 0'
    workflow_dispatch: {}
    push:
      branches: [main]
      paths:
        - .github/workflows/youtube.yml
        - scripts/update_broadcast.py

  permissions:
    contents: write
  jobs:
    update:
      runs-on: ubuntu-latest
      timeout-minutes: 5
      steps:
        - uses: actions/checkout@v4

        - name: Проверить YouTube
          env:
            YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          run: python3 scripts/update_broadcast.py

        - name: Сохранить data/broadcast.json
          run: |
            FILE=data/broadcast.json
            TRACKED=no
            git ls-files --error-unmatch "$FILE" >/dev/null 2>&1 && TRACKED=yes
            if [ "$TRACKED" = yes ] && git diff --quiet -- "$FILE"; then
              echo "Трансляция не изменилась — коммит не нужен."
              exit 0
            fi
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "Трансляция: обновить data/broadcast.json"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
